services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polosanca}
      POSTGRES_USER: ${POSTGRES_USER:-polosanca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - effective_cache_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polosanca} -d ${POSTGRES_DB:-polosanca}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: polosanca-api:latest
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    environment:
      FLASK_ENV: production
      TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-polosanca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polosanca}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  worker:
    image: polosanca-api:latest
    restart: unless-stopped
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    env_file:
      - deploy/.env.prod
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-polosanca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polosanca}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  beat:
    image: polosanca-api:latest
    restart: unless-stopped
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    env_file:
      - deploy/.env.prod
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-polosanca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-polosanca}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
