openapi: 3.0.3
info:
  title: Polo Sanca Refrigeration Monitoring API
  description: |
    Canonical OpenAPI 3.0 specification for the Polo Sanca multi-tenant refrigeration monitoring system (v1 MVP).

    For product context, user flows, RBAC semantics, and Phase 2 roadmap, see `PRD.md`.

    ## Authentication
    - **User Authentication**: JWT access tokens (`1h` TTL) via `Authorization: Bearer <access_token>` and refresh tokens (`30d` TTL) on `/auth/refresh`
    - **Equipment Authentication**: Per-equipment API keys via `X-API-Key: <key>` header (stored as `SHA-256` hashes at rest)

    ## Rate Limiting
    - `/auth/login`, `/auth/forgot-password`: 10 req/min per IP
    - `/equipments/telemetry`: 12 req/min per equipment
    - Authenticated user API calls: 100 req/min per user (`1000` req/min for Global Admin)
  version: 1.0.0
  contact:
    name: Polo Sanca API Support
    email: api@polosanca.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:5000/v1
    description: Local development server
  - url: https://api-staging.polosanca.com/v1
    description: Staging server
  - url: https://api.polosanca.com/v1
    description: Production server

tags:
  - name: Authentication
    description: Login, token refresh, logout, profile, and password recovery
  - name: Users
    description: User invitations, activation, roles, and viewer branch access
  - name: Companies
    description: Tenant company management
  - name: Branches
    description: Company branch locations
  - name: Equipment
    description: Refrigeration equipment registration, status, and API key rotation
  - name: Telemetry
    description: Hardware ingestion, manual offline temperature entry, live snapshots, and CSV exports
  - name: Alerts
    description: Alert listing, acknowledgment, resolution, statistics, and CSV exports
  - name: Alert Rules
    description: Generic alert rule configuration (Global Admin CRUD, Company Admin read-only)
  - name: Maintenance
    description: Per-equipment maintenance logbook
  - name: Audit Logs
    description: Immutable administrative audit trail (Global Admin only)

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate an active user and issue JWT `access_token` and `refresh_token`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secure_password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Revoke current JWT JTI in Redis blocklist until expiration.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Issue a new `access_token` using a valid `refresh_token` in the `Authorization` header.
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user profile
      description: Return the currently authenticated user's profile and branch access scope.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Authentication]
      summary: Update current user profile
      description: Update the authenticated user's own `name`.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change current user password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset email
      description: Sends a 1-hour single-use reset token if the email matches an active user. Always returns `200 OK` to prevent email enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset instructions dispatched if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      description: Redeem a valid 1-hour password reset token and set a new password.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users:
    get:
      tags: [Users]
      summary: List users
      description: List users scoped to caller permissions (Global Admin all; Company Admin own company only).
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: query
          description: Filter by company (Global Admin only)
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [global_admin, company_admin, company_viewer]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/invite:
    post:
      tags: [Users]
      summary: Invite a new user
      description: "Create a `pending` user and send a 7-day single-use invitation link. Company Admins invite into their own company (`company_admin` or `company_viewer`); Global Admins can invite into any company or invite new `global_admin` users (`company_id: null`)."
      operationId: inviteUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [global_admin, company_admin, company_viewer]
                company_id:
                  type: string
                  nullable: true
                branch_access:
                  $ref: '#/components/schemas/BranchAccess'
      responses:
        '201':
          description: User invited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user_id:
                    type: string
                  invitation_sent:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/accept-invitation:
    post:
      tags: [Users]
      summary: Accept user invitation
      description: Redeem a 7-day invitation token, set initial password, and transition user status from `pending` to `active`.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get user details
      description: Retrieve user details including `branch_access` (Global Admin or owning Company Admin).
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Users]
      summary: Update user
      description: Update user name, status, role, or viewer branch permissions (Global Admin, or owning Company Admin without escalating to `global_admin`).
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
                role:
                  type: string
                  enum: [global_admin, company_admin, company_viewer]
                branch_access:
                  $ref: '#/components/schemas/BranchAccess'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Deactivate or anonymize user
      description: Soft-deactivate user (`status = inactive`) or anonymize PII per LGPD while preserving historical foreign keys (Global Admin or owning Company Admin).
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deactivated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/resend-invitation:
    post:
      tags: [Users]
      summary: Resend user invitation
      description: Issue a fresh 7-day token and resend the invitation email for a `pending` user (Global Admin or owning Company Admin).
      operationId: resendInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies:
    get:
      tags: [Companies]
      summary: List companies
      description: List all tenant companies (Global Admin only).
      operationId: listCompanies
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated company list
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Companies]
      summary: Create company
      description: Create a new tenant company (Global Admin only).
      operationId: createCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                contact_email:
                  type: string
                  format: email
                contact_phone:
                  type: string
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /companies/{company_id}:
    get:
      tags: [Companies]
      summary: Get company details
      description: Get company profile (Global Admin, or Company users for their own company).
      operationId: getCompany
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Companies]
      summary: Update company
      description: Update company profile (Global Admin or own Company Admin; `status` changes restricted to Global Admin).
      operationId: updateCompany
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact_email:
                  type: string
                  format: email
                contact_phone:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /branches:
    get:
      tags: [Branches]
      summary: List branches
      description: List branches filtered by tenant and viewer branch restrictions.
      operationId: listBranches
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: query
          description: Filter by company (Global Admin only; auto-scoped for Company users)
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Branches]
      summary: Create branch
      description: Create a branch (Global Admin specifies `company_id`; Company Admin creates within own company).
      operationId: createBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                company_id:
                  type: string
                  description: Required for Global Admin; inferred for Company Admin
                name:
                  type: string
                address:
                  type: string
                manager_contact:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /branches/{branch_id}:
    get:
      tags: [Branches]
      summary: Get branch details
      description: Get branch details (enforces company ownership and viewer branch restriction).
      operationId: getBranch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchIdParam'
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Branches]
      summary: Update branch
      description: Update branch details (Global Admin or owning Company Admin).
      operationId: updateBranch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                manager_contact:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Branches]
      summary: Delete branch
      description: Delete branch (Global Admin or owning Company Admin). Returns `409 Conflict` if equipment is still assigned or if deletion would leave a restricted viewer with zero assigned branches.
      operationId: deleteBranch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchIdParam'
      responses:
        '204':
          description: Branch deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /equipments:
    get:
      tags: [Equipment]
      summary: List equipment
      description: List equipment filtered by tenant and viewer branch permissions.
      operationId: listEquipment
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: query
          description: Filter by company (Global Admin only)
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [freezer, refrigerator, cold_room]
        - name: status
          in: query
          schema:
            type: string
            enum: [operational, warning, critical, offline]
        - name: search
          in: query
          description: Substring search on equipment `serial`
          schema:
            type: string
        - name: include_inactive
          in: query
          description: Include soft-deactivated (`is_active = false`) equipment (default false)
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated equipment list
          content:
            application/json:
              schema:
                type: object
                required: [equipment, pagination]
                properties:
                  equipment:
                    type: array
                    items:
                      $ref: '#/components/schemas/Equipment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Equipment]
      summary: Register new equipment
      description: Register equipment in a branch (Global Admin or owning Company Admin). Derives `company_id` from `branch_id`, generates a secure API key, stores its `SHA-256` hash, and returns the plaintext `api_key` once.
      operationId: createEquipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial, type, branch_id]
              properties:
                serial:
                  type: string
                type:
                  type: string
                  enum: [freezer, refrigerator, cold_room]
                branch_id:
                  type: string
                manufacturer:
                  type: string
                model:
                  type: string
                installed_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Equipment registered (plaintext `api_key` returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /equipments/{equipment_id}:
    get:
      tags: [Equipment]
      summary: Get equipment details
      description: Get equipment metadata, latest readings, and maintenance dates (never exposes `api_key`).
      operationId: getEquipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EquipmentIdParam'
      responses:
        '200':
          description: Equipment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Equipment]
      summary: Update equipment
      description: Update equipment metadata or branch assignment within the same company (Global Admin or owning Company Admin).
      operationId: updateEquipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EquipmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
