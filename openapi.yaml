      description: Retrieve historical telemetry (`device` and `manual` entries) for accessible equipment.
      operationId: getEquipmentTelemetry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EquipmentIdParam'
        - name: start_date
          in: query
