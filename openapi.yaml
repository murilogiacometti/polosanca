components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    AcceptInvitationRequest:
      properties:
        token:
          minLength: 1
          title: Token
          type: string
        password:
          minLength: 8
          title: Password
          type: string
      required:
      - token
      - password
      type: object
    Alert:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        equipment_id:
          format: uuid
          title: Equipment Id
          type: string
        alert_rule_id:
          format: uuid
          type: string
          nullable: true
          title: Alert Rule Id
        serial:
          type: string
          nullable: true
          title: Serial
        branch_id:
          format: uuid
          type: string
          nullable: true
          title: Branch Id
        company_id:
          format: uuid
          type: string
          nullable: true
          title: Company Id
        type:
          $ref: '#/components/schemas/AlertRuleType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          title: Message
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        acknowledged_at:
          format: date-time
          type: string
          nullable: true
          title: Acknowledged At
        acknowledged_by:
          format: uuid
          type: string
          nullable: true
          title: Acknowledged By
        acknowledgment_notes:
          type: string
          nullable: true
          title: Acknowledgment Notes
        resolved_at:
          format: date-time
          type: string
          nullable: true
          title: Resolved At
        created_at:
          format: date-time
          type: string
          nullable: true
          title: Created At
      required:
      - id
      - equipment_id
      - type
      - severity
      - message
      - status
      type: object
    AlertAcknowledgeRequest:
      properties:
        notes:
          type: string
          nullable: true
          title: Notes
      type: object
    AlertRule:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        description:
          type: string
          nullable: true
          title: Description
        rule_type:
          $ref: '#/components/schemas/AlertRuleType'
        threshold_value:
          type: number
          nullable: true
          title: Threshold Value
        comparison_operator:
          allOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          nullable: true
        duration_seconds:
          title: Duration Seconds
          type: integer
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message_template:
          type: string
          nullable: true
          title: Message Template
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        scope_id:
          format: uuid
          type: string
          nullable: true
          title: Scope Id
        is_active:
          title: Is Active
          type: boolean
        created_by:
          format: uuid
          type: string
          nullable: true
          title: Created By
        created_at:
          format: date-time
          type: string
          nullable: true
          title: Created At
        updated_at:
          format: date-time
          type: string
          nullable: true
          title: Updated At
        priority:
          type: integer
          nullable: true
          title: Priority
        is_effective:
          type: boolean
          nullable: true
          title: Is Effective
      required:
      - id
      - name
      - rule_type
      - duration_seconds
      - severity
      - scope
      - is_active
      type: object
    AlertRuleCreateRequest:
      properties:
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        description:
          type: string
          nullable: true
          title: Description
        rule_type:
          $ref: '#/components/schemas/AlertRuleType'
        threshold_value:
          type: number
          nullable: true
          title: Threshold Value
        comparison_operator:
          allOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          nullable: true
        duration_seconds:
          default: 300
          minimum: 0
          title: Duration Seconds
          type: integer
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message_template:
          type: string
          nullable: true
          title: Message Template
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        scope_id:
          format: uuid
          type: string
          nullable: true
          title: Scope Id
        is_active:
          default: true
          title: Is Active
          type: boolean
      required:
      - name
      - rule_type
      - severity
      - scope
      type: object
    AlertRuleScope:
      enum:
      - global
      - company
      - equipment
      type: string
    AlertRuleStatisticsResponse:
      properties:
        rule_id:
          format: uuid
          title: Rule Id
          type: string
        total_triggers:
          title: Total Triggers
          type: integer
        triggers_last_30_days:
          title: Triggers Last 30 Days
          type: integer
        affected_equipments:
          title: Affected Equipments
          type: integer
        avg_triggers_per_equipment:
          title: Avg Triggers Per Equipment
          type: number
      required:
      - rule_id
      - total_triggers
      - triggers_last_30_days
      - affected_equipments
      - avg_triggers_per_equipment
      type: object
    AlertRuleType:
      enum:
      - temperature_high
      - temperature_low
      - pressure_high
      - pressure_low
      - door_open
      - equipment_offline
      type: string
    AlertRuleUpdateRequest:
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          nullable: true
          title: Name
        description:
          type: string
          nullable: true
          title: Description
        threshold_value:
          type: number
          nullable: true
          title: Threshold Value
        comparison_operator:
          allOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          nullable: true
        duration_seconds:
          minimum: 0
          type: integer
          nullable: true
          title: Duration Seconds
        severity:
          allOf:
          - $ref: '#/components/schemas/AlertSeverity'
          nullable: true
        message_template:
          type: string
          nullable: true
          title: Message Template
        is_active:
          type: boolean
          nullable: true
          title: Is Active
      type: object
    AlertRulesListResponse:
      properties:
        alert_rules:
          items:
            $ref: '#/components/schemas/AlertRule'
          title: Alert Rules
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - alert_rules
      - pagination
      type: object
    AlertSeverity:
      enum:
      - warning
      - critical
      type: string
    AlertSeverityCounts:
      properties:
        warning:
          default: 0
          title: Warning
          type: integer
        critical:
          default: 0
          title: Critical
          type: integer
      type: object
    AlertStatisticsResponse:
      properties:
        total_active:
          title: Total Active
          type: integer
        by_severity:
          $ref: '#/components/schemas/AlertSeverityCounts'
        by_type:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/AlertRuleType'
          title: By Type
          type: object
      required:
      - total_active
      type: object
    AlertStatus:
      enum:
      - active
      - acknowledged
      - resolved
      type: string
    AlertsListResponse:
      properties:
        alerts:
          items:
            $ref: '#/components/schemas/Alert'
          title: Alerts
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - alerts
      - pagination
      type: object
    AuditEntityType:
      enum:
      - company
      - branch
      - user
      - equipment
      - alert
      - alert_rule
      - maintenance_record
      type: string
    AuditLog:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        user_id:
          format: uuid
          type: string
          nullable: true
          title: User Id
        action:
          title: Action
          type: string
        entity_type:
          $ref: '#/components/schemas/AuditEntityType'
        entity_id:
          format: uuid
          type: string
          nullable: true
          title: Entity Id
        changes:
          additionalProperties: true
          type: object
          nullable: true
          title: Changes
        ip_address:
          type: string
          nullable: true
          title: Ip Address
        user_agent:
          type: string
          nullable: true
          title: User Agent
        created_at:
          format: date-time
          type: string
          nullable: true
          title: Created At
      required:
      - id
      - action
      - entity_type
      type: object
    AuditLogsListResponse:
      properties:
        audit_logs:
          items:
            $ref: '#/components/schemas/AuditLog'
          title: Audit Logs
          type: array
        next_page_token:
          type: string
          nullable: true
          title: Next Page Token
        pagination:
