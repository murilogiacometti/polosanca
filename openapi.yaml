                  nullable: true
      responses:
        '200':
          description: Maintenance record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Maintenance]
      summary: Delete maintenance record
      description: Delete a maintenance record (Global Admin or owning Company Admin).
      operationId: deleteMaintenanceRecord
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecordIdParam'
      responses:
        '204':
          description: Maintenance record deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: Query administrative audit logs
      description: List immutable administrative audit events (Global Admin only).
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageTokenParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  next_page_token:
                    type: string
                    nullable: true
                    description: Opaque keyset cursor for the next page (AIP-158); `null` when no further results exist
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `/auth/login` or `/auth/refresh`

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per-equipment API key for hardware telemetry ingestion

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageTokenParam:
      name: page_token
      in: query
      description: Opaque URL-safe base64 keyset cursor returned as `next_page_token` by the previous page (AIP-158). When supplied, overrides `page` offset pagination for O(1) index seeks.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    BranchIdParam:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
    EquipmentIdParam:
      name: equipment_id
      in: path
      required: true
      schema:
        type: string
    AlertIdParam:
      name: alert_id
      in: path
      required: true
      schema:
        type: string
    RuleIdParam:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
    RecordIdParam:
      name: record_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [global_admin, company_admin, company_viewer]
        company_id:
          type: string
          nullable: true
        branch_access:
          $ref: '#/components/schemas/BranchAccess'
        status:
          type: string
          enum: [active, inactive, pending]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true

    BranchAccess:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [full, restricted]
        branches:
          type: array
          items:
            type: string
          description: Assigned branch IDs (minimum 1 required when `type = restricted`)

    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        branches_count:
          type: integer
        equipment_count:
          type: integer
        contact_email:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        manager_contact:
          type: string
          nullable: true
        company_id:
          type: string
        equipment_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Equipment:
      type: object
      properties:
        id:
          type: string
        serial:
          type: string
        type:
          type: string
          enum: [freezer, refrigerator, cold_room]
        company_id:
          type: string
        branch_id:
          type: string
        branch_name:
          type: string
        status:
          type: string
          enum: [operational, warning, critical, offline]
        is_active:
          type: boolean
        current_data:
          $ref: '#/components/schemas/CurrentData'
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        installed_at:
          type: string
          format: date-time
          nullable: true
        last_maintenance_date:
          type: string
          format: date
          nullable: true
        next_maintenance_date:
          type: string
          format: date
          nullable: true

    EquipmentCreated:
      allOf:
        - $ref: '#/components/schemas/Equipment'
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: Plaintext API key returned only once upon creation

    CurrentData:
      type: object
      nullable: true
      properties:
        temperature:
          type: number
          format: float
        pressure:
          type: number
          format: float
          nullable: true
        door:
          type: string
          enum: [open, closed]
          nullable: true
        heater:
          type: string
          enum: [on, off]
          nullable: true
        compressor:
          type: string
          enum: [on, off]
          nullable: true
        fan:
          type: string
          enum: [on, off]
          nullable: true
        last_update:
          type: string
          format: date-time

    TelemetryData:
      type: object
      required: [serial, temperature, pressure, door, heater, compressor, fan]
      properties:
        serial:
          type: string
          example: EQ-12345
        temperature:
          type: number
          format: float
          description: Temperature in Celsius (°C)
          example: 4.5
        pressure:
          type: number
          format: float
          description: Gauge pressure in kilopascals (kPa)
          example: 120.3
        door:
          type: integer
          enum: [0, 1]
          description: 0=closed, 1=open
        heater:
          type: integer
          enum: [0, 1]
          description: 0=off, 1=on
        compressor:
          type: integer
          enum: [0, 1]
          description: 0=off, 1=on
        fan:
          type: integer
          enum: [0, 1]
          description: 0=off, 1=on
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          description: Optional client-generated idempotency key (AIP-155) to deduplicate retried hardware submissions per equipment unit

    TelemetryDataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        temperature:
          type: number
          format: float
        pressure:
          type: number
          format: float
          nullable: true
        door:
          type: integer
          nullable: true
        heater:
          type: integer
          nullable: true
        compressor:
          type: integer
          nullable: true
        fan:
          type: integer
          nullable: true
        source:
          type: string
          enum: [device, manual]
        recorded_by:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    RealtimeTelemetry:
      type: object
      properties:
        equipment_id:
          type: string
        serial:
          type: string
        branch_id:
          type: string
        temperature:
          type: number
          nullable: true
        pressure:
          type: number
          nullable: true
        door:
          type: string
          enum: [open, closed]
          nullable: true
        heater:
          type: string
          enum: [on, off]
          nullable: true
        compressor:
          type: string
          enum: [on, off]
          nullable: true
        fan:
          type: string
          enum: [on, off]
          nullable: true
        status:
          type: string
          enum: [operational, warning, critical, offline]
        last_update:
          type: string
          format: date-time
          nullable: true

    Alert:
      type: object
      properties:
        id:
          type: string
        equipment_id:
          type: string
        serial:
          type: string
        branch_id:
          type: string
        type:
          type: string
          enum: [temperature_high, temperature_low, pressure_high, pressure_low, door_open, equipment_offline]
        severity:
          type: string
          enum: [warning, critical]
        message:
          type: string
        status:
          type: string
          enum: [active, acknowledged, resolved]
        created_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_by:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true

    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        rule_type:
          type: string
          enum: [temperature_high, temperature_low, pressure_high, pressure_low, door_open, equipment_offline]
        threshold_value:
          type: number
          nullable: true
        comparison_operator:
          type: string
          enum: ['>', '<', '=', '>=', '<=']
          nullable: true
        duration_seconds:
          type: integer
        severity:
          type: string
          enum: [warning, critical]
        message_template:
          type: string
          nullable: true
        scope:
          type: string
          enum: [global, company, equipment]
        scope_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertRuleCreate:
      type: object
      required: [name, rule_type, duration_seconds, severity, scope]
      properties:
        name:
          type: string
        description:
          type: string
        rule_type:
          type: string
          enum: [temperature_high, temperature_low, pressure_high, pressure_low, door_open, equipment_offline]
        threshold_value:
          type: number
          nullable: true
          description: Required for numeric rules; null for `door_open` and `equipment_offline`
        comparison_operator:
          type: string
          enum: ['>', '<', '=', '>=', '<=']
          nullable: true
          description: Required for numeric rules; null for `door_open` and `equipment_offline`
        duration_seconds:
          type: integer
          default: 300
        severity:
          type: string
          enum: [warning, critical]
        message_template:
          type: string
        scope:
          type: string
          enum: [global, company, equipment]
        scope_id:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true

    AlertRuleWithPriority:
      allOf:
        - $ref: '#/components/schemas/AlertRule'
        - type: object
          properties:
            priority:
              type: integer
              description: Rule priority (1=equipment, 2=company, 3=global)
            is_effective:
              type: boolean
              description: True if not shadowed by a higher-priority rule for the same `(rule_type, severity)`

    MaintenanceRecord:
      type: object
      properties:
        id:
          type: string
        equipment_id:
          type: string
        type:
          type: string
          enum: [routine_inspection, repair, part_replacement, emergency_fix]
        description:
          type: string
        performed_by:
          type: string
        performed_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        next_maintenance_date:
          type: string
          format: date
          nullable: true

    AuditLog:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          nullable: true
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          nullable: true
        changes:
          type: object
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Bad Request - Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions or inactive account/tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource state or uniqueness conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
